services:
  lettro-game:
    build:
      context: .
      target: ${BUILD_TARGET:-development}
    container_name: lettro-${ENV:-dev}
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      # Only mount volumes in development
      - ${VOLUME_MOUNT:-./:/lettro-game}
      - ${NODE_MODULES_VOLUME:-/lettro-game/node_modules}
    env_file:
      - ./.env.${ENV:-development}.local
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - lettro-network
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: lettro-postgres-${ENV:-dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_${ENV:-dev}_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    env_file:
      - ./.env.${ENV:-development}.local
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lettro} -d ${POSTGRES_DB:-lettro_dev}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - lettro-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: lettro-redis-${ENV:-dev}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_${ENV:-dev}_data:/data
    command: redis-server ${REDIS_CONFIG:-}
    env_file:
      - ./.env.${ENV:-development}.local
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lettro-network
    restart: unless-stopped

volumes:
  postgres_dev_data:
  postgres_staging_data:
  postgres_production_data:
  redis_dev_data:
  redis_staging_data:
  redis_production_data:

networks:
  lettro-network:
    driver: bridge